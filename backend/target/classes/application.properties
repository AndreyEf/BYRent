# Server Configuration
server.port=5001

# Database Configuration - handled by DatabaseConfig.java

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Session Configuration
server.servlet.session.timeout=30d
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true

# Admin Configuration
admin.password=${ADMIN_PASSWORD:admin123}

# Object Storage
object.storage.bucket=${DEFAULT_OBJECT_STORAGE_BUCKET_ID:}
object.storage.public.paths=${PUBLIC_OBJECT_SEARCH_PATHS:public}
object.storage.private.dir=${PRIVATE_OBJECT_DIR:.private}

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.rentflow=DEBUG
